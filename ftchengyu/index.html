<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="成语闯关隐私政策与支持页面。">
    <title>成语闯关</title>
    <link rel="icon" href="assets/icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./">
            <img src="assets/icon.png" alt="">
            <span>成语闯关</span>
        </a>
        <div class="header-tools">
            <a class="header-link" href="privacy/">隐私政策</a>
            <a class="header-link" href="support/">获取支持</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">成语闯关 for iPhone &amp; iPad</p>
                <h1>选一选，学成语。</h1>
                <p class="hero-summary">本地优先的成语拼字闯关应用：边玩边记，查释义、听读音、收藏复习。无需注册，不接广告。</p>
                <div class="support-actions">
                    <a class="button primary" href="privacy/">隐私政策</a>
                    <a class="button" href="support/">获取支持</a>
                    <a class="button" href="https://apps.apple.com/us/app/ftchengyu/id6820137866">App Store</a>
                </div>
            </div>
        </section>

        <section class="summary-band reveal" aria-label="产品要点">
            <div class="summary-item">
                <strong>本地优先</strong>
                <p>进度与收藏主要保存在设备上，可选 iCloud 同步。</p>
            </div>
            <div class="summary-item">
                <strong>不跟踪</strong>
                <p>无第三方广告、无分析 SDK、不进行跨 App 追踪。</p>
            </div>
            <div class="summary-item">
                <strong>简单支持</strong>
                <p>使用说明与问题反馈邮箱一目了然。</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 成语闯关</p>
        <p><a href="privacy/">隐私政策</a> · <a href="support/">获取支持</a></p>
    </footer>
    <script src="site.js" defer></script>
