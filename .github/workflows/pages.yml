name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Wait for artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            if [ "$n" -gt 0 ]; then
              echo "github-pages artifact visible after $((i * 5))s"
              exit 0
            fi
            echo "artifact not listed yet ($((i * 5))s), waiting..."
            sleep 5
          done
          echo "::error::github-pages artifact still not listed after 150s"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
